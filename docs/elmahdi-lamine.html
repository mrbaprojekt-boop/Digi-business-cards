<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elmahdi Lamine — CDR</title>
<meta name="description" content="Elmahdi Lamine, CEO at CDR. Creative | Development | Research">
<meta property="og:title" content="Elmahdi Lamine — CDR">
<meta property="og:description" content="CEO · Creative | Development | Research">
<meta property="og:url" content="https://mrbaprojekt-boop.github.io/Digi-business-cards/elmahdi-lamine.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#b4d335; --ink:#1a1a1a; --paper:#ffffff;
    --muted:#6b6b6b; --line:#e6e6e6; --page:#f4f4f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--page); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.5;
  }
  .card{
    width:100%; max-width:420px; background:var(--paper);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
  }
  .accent{height:8px;background:var(--lime)}
  .pad{padding:32px}
  .logo{font-family:Anton,Inter,sans-serif;font-size:60px;line-height:.9;letter-spacing:.01em}
  .tagline{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--ink);
    font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--ink)
  }
  .unit{
    display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;
    background:var(--lime);font-size:12px;font-weight:600
  }
  .who{margin-top:28px}
  .who h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .who .title{color:var(--muted);font-size:15px;margin-top:2px}
  .rows{margin-top:24px;border-top:1px solid var(--line)}
  .row{
    display:flex;flex-direction:column;gap:2px;
    padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit
  }
  .row .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .row .v{font-size:16px;font-weight:600;word-break:break-word}
  a.row:hover .v{color:#000;text-decoration:underline}
  .addr{padding:14px 0 0;font-size:14px;color:var(--muted)}
  .qr-wrap{margin-top:24px;display:flex;gap:16px;align-items:center}
  #qr{width:104px;height:104px;flex:none;background:#f0f0f0;border-radius:10px;padding:8px}
  #qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
  .qr-hint{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .btn{
    flex:1 1 140px;text-align:center;padding:13px 16px;border-radius:12px;
    font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--ink)
  }
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .foot{padding:16px 32px;background:#fafafa;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
  .foot a{color:var(--muted)}
  @media(max-width:400px){.pad{padding:24px}.logo{font-size:52px}}
</style>
</head>
<body>
<main class="card">
  <div class="accent"></div>
  <div class="pad">
    <div class="logo">CDR</div>
    <div class="tagline">Creative | Development | Research</div>
    <div class="unit">GPU &amp; GSE Equipment</div>

    <div class="who">
      <h1>Elmahdi Lamine</h1>
      <div class="title">CEO</div>
    </div>

    <div class="rows">
      <a class="row" href="tel:+37255512147"><span class="k">Phone</span><span class="v">+372 555 121 47</span></a>
      <a class="row" href="mailto:el@cdr.ee"><span class="k">Email</span><span class="v">el@cdr.ee</span></a>
      <a class="row" href="https://cdr.ee" target="_blank" rel="noopener"><span class="k">Web</span><span class="v">cdr.ee</span></a>
      
      <div class="addr">Taevavärava tee 6b-24<br>Lehmja küla, Rae vald<br>75306 Estonia</div>
    </div>

    <div class="qr-wrap">
      <div id="qr"></div>
      <div class="qr-hint">Scan with a phone camera<br>to open this card</div>
    </div>

    <div class="actions">
      <a class="btn primary" href="./elmahdi-lamine.vcf" download>Save contact</a>
      <a class="btn ghost" id="share" href="#">Share</a>
    </div>
  </div>

  <div class="foot">
    <span>CDR</span>
    <a href="https://cdr.ee" target="_blank" rel="noopener">cdr.ee</a>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  (function(){
    var override = null;
    var url = override || "https://mrbaprojekt-boop.github.io/Digi-business-cards/elmahdi-lamine.html";
    try{
      new QRCode(document.getElementById("qr"), {
        text: url, width: 200, height: 200,
        colorDark: "#1a1a1a", colorLight: "#f0f0f0",
        correctLevel: QRCode.CorrectLevel.M
      });
    }catch(e){ document.getElementById("qr").remove(); }

    var share = document.getElementById("share");
    var shareData = {
      title: "Elmahdi Lamine — CDR",
      text: "Elmahdi Lamine, CEO",
      url: url
    };
    share.addEventListener("click", function(ev){
      ev.preventDefault();
      if (navigator.share) { navigator.share(shareData).catch(function(){}); }
      else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function(){
          share.textContent = "Link copied";
          setTimeout(function(){ share.textContent = "Share"; }, 2000);
        });
      } else { prompt("Copy this link:", url); }
    });
  })();
</script>
</body>
</html>
